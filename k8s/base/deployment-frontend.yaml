apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
      - name: wait-for-backend
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z backend-service 8000; do echo waiting for backend; sleep 2; done']
      containers:
      - name: frontend
        image: ghcr.io/kerenstoller/gymglow-frontend:1.0
        ports:
        - containerPort: 80
