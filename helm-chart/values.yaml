nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  repository: ghcr.io/kerenstoller/gymglow-backend
  tag: "1.6" # Updated for Cloud (AMD64)
  pullPolicy: IfNotPresent

imagePullSecrets: []

appUser: "default-user"

secret:
  # rootPassword: ""

names:
  backend: "backend" # Added for configurability
  backendService: "backend" # Added for configurability
  frontend: "frontend"
  frontendService: "frontend-service" # Explicit service name from HW example might imply separating them
  mariadb: "db" # Using 'db' to match our postgres, though key is mariadb
  mariadbService: "db-service"

backend:
  service:
    type: NodePort

frontend:
  service:
    # Default to ClusterIP for local Minikube to avoid port 80 conflict with Ingress.
    # Override to LoadBalancer for Cloud (GCP/AWS) using --set frontend.service.type=LoadBalancer
    type: ClusterIP

ingress:
  enabled: true
  host: "" # Empty means "Any Host" (Wildcard) - allows access via IP address

networkPolicy:
  enabled: true
