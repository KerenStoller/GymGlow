apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gymglow.fullname" . }}-{{ .Values.names.mariadb }}
  labels:
    {{- include "gymglow.labels" . | nindent 4 }}
spec:
  replicas: 1 # Hardcoded
  serviceName: {{ include "gymglow.fullname" . }}-{{ .Values.names.mariadbService }}
  selector:
    matchLabels:
      app: {{ include "gymglow.fullname" . }}-{{ .Values.names.mariadb }}
  template:
    metadata:
      labels:
        app: {{ include "gymglow.fullname" . }}-{{ .Values.names.mariadb }}
    spec:
      containers:
        - name: db
          image: "postgres:15-alpine" # Hardcoded
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "gymglow.fullname" . }}-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "gymglow.fullname" . }}-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gymglow.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/subdata
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "gymglow"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "gymglow"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
