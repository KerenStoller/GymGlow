apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gymglow.fullname" . }}-{{ .Values.names.frontend }}
  labels:
    {{- include "gymglow.labels" . | nindent 4 }}
spec:
  replicas: 2 # Hardcoded as per simplified values
  selector:
    matchLabels:
      app: {{ include "gymglow.fullname" . }}-{{ .Values.names.frontend }}
  template:
    metadata:
      labels:
        app: {{ include "gymglow.fullname" . }}-{{ .Values.names.frontend }}
    spec:
      containers:
        - name: frontend
          image: "ghcr.io/kerenstoller/gymglow-frontend:1.6" # Updated for Cloud (AMD64)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      initContainers:
      - name: wait-for-backend
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z {{ include "gymglow.fullname" . }}-backend 8000; do echo waiting for backend; sleep 2; done']
